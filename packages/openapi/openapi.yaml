        - $ref: "#/components/schemas/CreateCommerceVideoProjectRequest"
      discriminator:
        propertyName: projectKind
        mapping:
          narrative: "#/components/schemas/CreateNarrativeProjectRequest"
          commerce_video: "#/components/schemas/CreateCommerceVideoProjectRequest"
    CreateProjectBaseRequest:
      type: object
      required: [workspaceId, name, projectKind]
      properties:
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        projectKind:
          type: string
          enum: [narrative, commerce_video]
        aspectRatio:
          type: string
        videoRatio:
          type: string
          default: "16:9"
        audioStrategy:
          type: string
          enum: [native_av, hybrid, tts_postdub]
          default: native_av
        audioRequirement:
          type: string
          enum: [preferred, required, disabled]
          default: preferred
        imageQuality:
          type: string
          default: standard
        timelineTimebase:
          type: integer
          format: int64
          default: 90000
        fpsNumerator:
          type: integer
          default: 24
        fpsDenominator:
          type: integer
          default: 1
        settings:
          type: object
    CreateNarrativeProjectRequest:
      allOf:
        - $ref: "#/components/schemas/CreateProjectBaseRequest"
        - type: object
          required: [projectKind]
          properties:
            projectKind:
              type: string
              enum: [narrative]
            projectType:
              type: string
              enum: [short_film, comic_drama, brand_ad, character_ip, other]
            contentType:
              type: string
              enum: [novel, script, storyboard_first, original]
            artStyle:
              type: string
            directorManualPromptVersionId:
              type: string
              format: uuid
            visualManualPromptVersionId:
              type: string
              format: uuid
            imageModelProfileKey:
              type: string
              default: image_generation_default
            videoModelProfileKey:
              type: string
              default: video_generation_default
            scriptModelProfileKey:
              type: string
              default: script_agent_default
            ttsModelProfileKey:
              type: string
              default: tts_generation_default
            asrModelProfileKey:
              type: string
              default: audio_transcription_default
            videoProductionProfileKey:
              allOf:
                - $ref: "#/components/schemas/VideoProductionProfileKey"
              default: single_frame_i2v
            videoProductionProfileVersion:
              type: integer
              minimum: 1
            compatibilityPolicy:
              type: string
              enum: [strict, compatible_fallback]
              default: strict
            audioStrategy:
              type: string
              enum: [native_av, hybrid, tts_postdub]
              default: native_av
    CreateCommerceVideoProjectRequest:
      allOf:
        - $ref: "#/components/schemas/CreateProjectBaseRequest"
        - type: object
          required: [projectKind]
          properties:
            projectKind:
              type: string
              enum: [commerce_video]
            defaultTargetDurationSeconds:
              type: integer
              minimum: 1
              default: 30
            defaultTargetPlatform:
              type: string
              minLength: 1
              default: douyin
            defaultLanguageMode:
              type: string
              enum: [auto, explicit]
              default: auto
            defaultTargetLanguage:
              type: string
              description: BCP 47 language tag. Required when defaultLanguageMode is explicit.
            audioStrategy:
              type: string
              enum: [native_av, external_audio]
              default: native_av
      description: Idempotency-Key is required. Narrative manuals and direct model/profile fields are rejected.
