              type: string
              format: uuid
            duration:
              type: number
              default: 5
            aspectRatio:
              type: string
              default: "16:9"
            resolution:
              type: string
              default: "720p"
            pollIntervalSeconds:
              type: integer
              default: 5
            maxPolls:
              type: integer
              default: 120
            maxShots:
              type: integer
              minimum: 1
              maximum: 3
              default: 3
            skipCompose:
