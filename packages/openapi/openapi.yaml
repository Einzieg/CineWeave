        format: uuid
    PolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CircuitStateId:
      name: stateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationHeader:
      name: X-Organization-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GatewayError:
      description: Internal Provider Gateway error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayErrorEnvelope"
  schemas:
    Envelope:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
        data: {}
        meta: {}
    SystemStatusEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/SystemStatus"
    SystemStatus:
      type: object
      required: [status, services, version]
      properties:
        status:
          type: string
          enum: [ok]
        services:
          $ref: "#/components/schemas/SystemServices"
        version:
          type: string
    SystemServices:
      type: object
      required: [database, temporal, storage, providerGateway]
      properties:
        database:
          type: string
          enum: [ok, unknown]
        temporal:
          type: string
          enum: [ok, unknown]
        storage:
          type: string
          enum: [ok, unknown]
        providerGateway:
          type: string
          enum: [ok, unknown]
    SystemEditionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/SystemEdition"
    SystemEdition:
      type: object
      required:
        - deploymentEdition
        - distributionId
        - coreReleaseId
        - contractVersion
        - contractHash
        - compiledFeatures
        - compiledModules
        - operationalMode
      properties:
        deploymentEdition:
          type: string
          enum: [community, cloud, enterprise]
        distributionId:
          type: string
        coreReleaseId:
          type: string
        commercialReleaseId:
          type: string
        contractVersion:
          type: string
          const: edition.v1
        contractHash:
          type: string
          minLength: 1
        compiledFeatures:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/EditionFeatureKey"
        compiledModules:
          type: array
          items:
            $ref: "#/components/schemas/EditionCompiledModule"
        operationalMode:
          type: string
          enum: [normal, commercial_restricted]
        restrictionReason:
          $ref: "#/components/schemas/EditionRestrictionReason"
    EditionFeatureKey:
      type: string
      enum:
        - core.workflow
        - core.provider_gateway
        - core.self_hosting
        - billing.shadow_account
        - billing.balance
        - billing.top_up
        - billing.subscription
        - billing.organization_wallet
        - billing.reconciliation
        - billing.invoice
        - governance.sso
        - governance.scim
        - governance.audit_export
        - operations.supported_ha_tooling
        - operations.managed_disaster_recovery
    EditionCompiledModule:
      type: object
      required: [key, featureKey, contentHash]
      properties:
        key:
          type: string
        featureKey:
          $ref: "#/components/schemas/EditionFeatureKey"
        contentHash:
          type: string
    EditionRestrictionReason:
      type: string
      enum:
        - license_invalid
        - license_not_yet_valid
        - license_expired
        - license_revoked
        - clock_rollback_suspected
        - deployment_mismatch
    EntitlementSnapshotEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/EntitlementSnapshot"
    EntitlementSnapshot:
      type: object
      required: [contractVersion, edition, subject, decisions, evaluatedAt]
      properties:
        contractVersion:
          type: string
          const: edition.v1
        edition:
          type: string
          enum: [community, cloud, enterprise]
        subject:
          $ref: "#/components/schemas/EntitlementSubject"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/EntitlementDecision"
        evaluatedAt:
          type: string
          format: date-time
    EntitlementSubject:
      type: object
      required: [userId, organizationId]
      properties:
        userId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        billingAccountId:
          type: string
          format: uuid
    EntitlementDecision:
      type: object
      required: [featureKey, compiled, deploymentLicensed, tenantEntitled, allowed]
      properties:
        featureKey:
          type: string
        compiled:
          type: boolean
        deploymentLicensed:
          type: boolean
        tenantEntitled:
          type: boolean
        allowed:
          type: boolean
        reason:
          $ref: "#/components/schemas/EntitlementDenialCode"
    EntitlementDenialCode:
      type: string
      enum:
        - feature_unknown
        - feature_not_compiled
        - deployment_license_invalid
        - deployment_license_not_yet_valid
        - deployment_license_expired
        - deployment_license_revoked
        - deployment_clock_rollback_suspected
        - plan_entitlement_required
        - billing_account_suspended
        - permission_denied
        - billing_binding_invalid
        - billing_account_scope_mismatch
        - billing_authority_mismatch
        - billing_sponsorship_required
        - billing_routing_candidate_missing
    ErrorEnvelope:
