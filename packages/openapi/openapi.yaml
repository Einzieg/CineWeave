openapi: 3.1.0
info:
  title: CineWeave API
  version: 0.1.0
  description: API contract seed for the Phase 1 CineWeave control plane.
servers:
  - url: http://localhost:19288
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /readyz:
    get:
      operationId: getReady
      responses:
        "200":
          description: Service readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /api/system/status:
    get:
      operationId: getSystemStatus
      responses:
        "200":
          description: Non-sensitive system readiness status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusEnvelope"
  /api/system/edition:
    get:
      operationId: getSystemEdition
      responses:
        "200":
          description: Safe immutable edition and operational-state identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemEditionEnvelope"
  /api/me/entitlements:
    get:
      operationId: getMyEntitlements
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current organization-scoped deployment and tenant entitlement decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementSnapshotEnvelope"
        "401":
          $ref: "#/components/responses/Error"
  /api/realtime/events:
    get:
      operationId: subscribeRealtimeEvents
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Server-sent project event stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/system/setup-state:
    get:
      operationId: getSystemSetupState
      responses:
        "200":
          description: Whether the deployment needs first-run setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStateResponseEnvelope"
  /api/system/setup:
    post:
      operationId: setupSystem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemSetupRequest"
      responses:
        "201":
          description: First administrator session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSetupResponseEnvelope"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/system/organizations:
    get:
      operationId: listSystemOrganizations
      description: Lists every organization. Requires a live system administrator account.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Global organization directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOrganizationListEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    post:
      operationId: createSystemOrganization
      description: Creates an organization, its default workspace, and an initial direct owner. Requires a live system administrator account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSystemOrganizationRequest"
      responses:
        "201":
          description: Organization created by a system administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSystemOrganizationEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/system/organizations/{organizationId}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: listSystemOrganizationMembers
      description: Lists members of any organization. Requires a live system administrator account and does not require membership in the target organization.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled, removed]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Paginated organization members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberListEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createSystemOrganizationMember
      description: Directly creates a new account or attaches an existing active account, activates its organization membership, and grants the base organization-member role. Requires a live system administrator account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSystemOrganizationMemberRequest"
      responses:
        "201":
          description: Directly created or attached organization member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/system/organizations/{organizationId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateSystemOrganizationMember
      description: Updates a member account identity, profile, password, or active/disabled membership state. Password changes revoke every account session. System-administrator target accounts remain protected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSystemOrganizationMemberRequest"
      responses:
        "200":
          description: Updated organization member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered user with initial organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/auth/register-with-invitation:
    post:
      operationId: registerWithInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWithInvitationRequest"
      responses:
        "201":
          description: Registered user, accepted invitation, and target organization session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session or organization selection challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/auth/select-organization:
    post:
      operationId: selectOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectOrganizationRequest"
      responses:
        "200":
          description: Session for the selected organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          $ref: "#/components/responses/Error"
  /api/auth/switch-organization:
    post:
      operationId: switchOrganization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchOrganizationRequest"
      responses:
        "200":
          description: Rotated current-device session for the target organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/auth/refresh:
    post:
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated refresh token and access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          $ref: "#/components/responses/Error"
  /api/auth/logout:
    post:
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /api/auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      description: Consumes a one-time organization-issued reset token and sets a new password. The token is never accepted from a query parameter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordResetRequest"
      responses:
        "200":
          description: Password reset completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "410":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/auth/me:
    get:
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeEnvelope"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCurrentUserProfile
      description: Updates display name and avatar only; username and email remain immutable here.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated current user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/auth/me/username:
    post:
      operationId: setInitialUsername
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  $ref: "#/components/schemas/Username"
      responses:
        "200":
          description: Username set for a historical account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/organization-invitations/resolve:
    post:
      operationId: resolveOrganizationInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveInvitationRequest"
      responses:
        "200":
          description: Masked invitation summary
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitationEnvelope"
        "410":
          $ref: "#/components/responses/Error"
  /api/organization-invitations/accept:
    post:
      operationId: acceptOrganizationInvitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Invitation accepted and target organization session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
  /api/provider-webhooks/{providerAccountId}/{webhookSecret}:
    post:
      operationId: receiveProviderWebhook
      parameters:
        - name: providerAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: webhookSecret
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWebhookResultEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/organizations:
    get:
      operationId: listOrganizations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organizations for current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationListEnvelope"
  /api/organizations/{organizationId}:
    get:
      operationId: getOrganization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationEnvelope"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateOrganization
      description: Updates the organization name. The slug is immutable in this phase.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationEnvelope"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/organizations/{organizationId}/leave:
    post:
      operationId: leaveOrganization
      description: Removes the current member's access relationships and revokes organization sessions. The last direct owner cannot leave.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Current member left the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/organizations/{organizationId}/audit-logs:
    get:
      operationId: listOrganizationAuditLogs
      description: Requires audit.read. Records are retained for the organization lifetime and contain no plaintext invitation, password, or session tokens.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: action
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: actorUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Paginated organization audit records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationAuditLogListEnvelope"
        "403":
          $ref: "#/components/responses/Error"
  /api/organizations/{organizationId}/members:
    get:
      operationId: listOrganizationMembers
      description: Requires member.read on the selected organization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled, removed]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Paginated organization members with effective access sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberListEnvelope"
        "403":
          $ref: "#/components/responses/Error"
  /api/organizations/{organizationId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getOrganizationMember
      description: Requires member.read on the selected organization.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organization member detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberEnvelope"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateOrganizationMemberStatus
      description: Requires member.manage; supports active and disabled transitions only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationMemberRequest"
      responses:
        "200":
          description: Updated organization member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberEnvelope"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeOrganizationMember
      description: Requires member.manage and clears organization access relationships.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/organizations/{organizationId}/members/{userId}/profile:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateOrganizationMemberProfile
      description: Requires member.manage. Updates display name or avatar only when the account belongs exclusively to this organization; username and email remain immutable.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated organization member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberEnvelope"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/organizations/{organizationId}/members/{userId}/password-reset:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: issueOrganizationMemberPasswordReset
      description: Requires member.manage. Invalidates the old password and all sessions, then returns a one-time 30-minute token only for an account that belongs exclusively to this organization. A non-owner cannot reset a direct owner's account.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: One-time password reset token; returned only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPasswordResetEnvelope"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/organizations/{organizationId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: listOrganizationInvitations
      description: Requires member.read on the selected organization.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Organization invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitationListEnvelope"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createOrganizationInvitation
      description: Requires member.manage; optional bindings additionally require role.manage on each resource.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationInvitationRequest"
      responses:
        "201":
          description: Invitation created; plaintext invitationToken is returned only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitationEnvelope"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/organizations/{organizationId}/invitations/{invitationId}:
    delete:
      operationId: revokeOrganizationInvitation
      description: Requires member.manage on the selected organization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invitation revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "403":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
  /api/workspaces:
    get:
      operationId: listWorkspaces
      security:
        - bearerAuth: []
      parameters:
