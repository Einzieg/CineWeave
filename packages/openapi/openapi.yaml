          description: Created prompt version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptVersionEnvelope"
  /api/prompt-versions/{versionId}/activate:
    post:
      operationId: activatePromptVersion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Activated prompt version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptVersionEnvelope"
  /api/prompt-bindings:
    get:
      operationId: listPromptBindings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: filter[projectId]
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Prompt bindings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptBindingListEnvelope"
    post:
      operationId: createPromptBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromptBindingRequest"
      responses:
        "201":
          description: Created prompt binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptBindingEnvelope"
  /api/prompt-bindings/{bindingId}:
    delete:
      operationId: deletePromptBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: bindingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted prompt binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /api/prompts/render-test:
    post:
      operationId: renderPromptTest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderPromptRequest"
      responses:
        "200":
          description: Rendered prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderedPromptEnvelope"
  /internal/provider/models/discover:
    post:
      operationId: internalProviderDiscoverModels
      summary: Internal Provider Gateway model discovery
      description: Internal API. Requires bearer service token and must not be exposed publicly.
      security:
        - serviceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayDiscoverModelsRequest"
      responses:
        "200":
          description: Provider model discovery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDiscoverModelsEnvelope"
        "401":
          $ref: "#/components/responses/GatewayError"
        "422":
          $ref: "#/components/responses/GatewayError"
        "502":
          $ref: "#/components/responses/GatewayError"
  /internal/provider/models/constraints:
    post:
      operationId: internalProviderResolveModelConstraints
      summary: Resolve model constraints for an internal model profile
      description: Internal API. Provider Gateway owns routing and returns the current candidate models with structured prompt limits.
      security:
        - serviceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayModelConstraintsRequest"
      responses:
        "200":
          description: Routed model constraints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayModelConstraintsEnvelope"
        "401":
          $ref: "#/components/responses/GatewayError"
        "422":
          $ref: "#/components/responses/GatewayError"
  /internal/provider/text/generate:
    post:
      operationId: internalProviderTextGenerate
      summary: Internal Provider Gateway text generation
      description: Internal API. Requires bearer service token and must not be exposed publicly.
      security:
        - serviceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayTextRequest"
      responses:
        "200":
          description: Provider text generation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayTextEnvelope"
        "401":
          $ref: "#/components/responses/GatewayError"
        "422":
          $ref: "#/components/responses/GatewayError"
        "502":
          $ref: "#/components/responses/GatewayError"
  /internal/provider/image/generate:
    post:
      operationId: internalProviderImageGenerate
      summary: Internal Provider Gateway image generation
      description: Internal API. Requires bearer service token, calls OpenAI-compatible Images API, and stores media in S3 / MinIO before returning artifact and media file ids.
      security:
        - serviceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayImageRequest"
      responses:
        "200":
          description: Provider image generation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayImageEnvelope"
        "401":
          $ref: "#/components/responses/GatewayError"
        "422":
          $ref: "#/components/responses/GatewayError"
        "502":
          $ref: "#/components/responses/GatewayError"
  /internal/provider/video/plan:
    post:
      operationId: internalProviderVideoPlan
      summary: Resolve an immutable Provider Gateway video execution plan
      description: Internal API. Selects one complete conditional video capability variant, quantizes the narrative shot duration, and persists executable render segments.
      security:
        - serviceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayVideoPlanRequest"
      responses:
        "200":
          description: Provider video execution plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayVideoPlanEnvelope"
        "401":
          $ref: "#/components/responses/GatewayError"
        "422":
          $ref: "#/components/responses/GatewayError"
        "502":
          $ref: "#/components/responses/GatewayError"
  /internal/provider/audio/tts:
    post:
      operationId: internalProviderAudioTTS
      summary: Internal Provider Gateway speech synthesis
      description: Internal API. Resolves credentials and an audio model, calls an OpenAI-compatible speech endpoint, stores the resulting media, and records call and cost rows.
      security:
        - serviceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayTTSRequest"
      responses:
        "200":
          description: Stored speech synthesis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayTTSEnvelope"
        "401":
          $ref: "#/components/responses/GatewayError"
        "422":
          $ref: "#/components/responses/GatewayError"
        "502":
          $ref: "#/components/responses/GatewayError"
  /internal/provider/audio/transcribe:
    post:
      operationId: internalProviderAudioTranscribe
      summary: Internal Provider Gateway audio transcription
      description: Internal API. Reads only project-registered media, resolves credentials and an audio model, and records ASR call and cost rows.
      security:
        - serviceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayASRRequest"
      responses:
        "200":
          description: Audio transcription with segment and word timestamps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayASREnvelope"
        "401":
          $ref: "#/components/responses/GatewayError"
        "422":
          $ref: "#/components/responses/GatewayError"
        "502":
          $ref: "#/components/responses/GatewayError"
  /internal/provider/video/retry-segment:
    post:
      operationId: internalProviderVideoRetrySegment
      summary: Prepare an isolated failed video render segment retry
      description: Reuses the current model once or selects an active same-family candidate with the identical capability snapshot. Returns RENDER_PLAN_REPLAN_REQUIRED when the whole shot must be replanned.
      security:
        - serviceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayVideoRetrySegmentRequest"
      responses:
        "200":
          description: Failed segment reset for a same-family retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayVideoRetrySegmentEnvelope"
        "401":
          $ref: "#/components/responses/GatewayError"
        "409":
          $ref: "#/components/responses/GatewayError"
        "422":
          $ref: "#/components/responses/GatewayError"
  /internal/provider/video/create-task:
    post:
      operationId: internalProviderVideoCreateTask
      summary: Internal Provider Gateway video task creation
      description: Internal API. Requires bearer service token and creates an asynchronous declarative HTTP video provider task.
      security:
        - serviceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayVideoCreateTaskRequest"
      responses:
        "200":
          description: Provider video task creation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayVideoCreateTaskEnvelope"
        "401":
          $ref: "#/components/responses/GatewayError"
        "422":
          $ref: "#/components/responses/GatewayError"
        "502":
          $ref: "#/components/responses/GatewayError"
  /internal/provider/video/poll-task:
    post:
      operationId: internalProviderVideoPollTask
      summary: Internal Provider Gateway video task polling
      description: Internal API. Requires bearer service token, polls upstream status, and stores completed video media in S3 / MinIO.
      security:
        - serviceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayVideoPollTaskRequest"
      responses:
        "200":
          description: Provider video polling result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayVideoPollTaskEnvelope"
        "401":
          $ref: "#/components/responses/GatewayError"
        "422":
          $ref: "#/components/responses/GatewayError"
        "502":
          $ref: "#/components/responses/GatewayError"
  /internal/provider/video/cancel-task:
    post:
      operationId: internalProviderVideoCancelTask
      summary: Internal Provider Gateway video task cancellation
      description: Internal API. Requires bearer service token and cancels an upstream task when the manifest exposes a cancel endpoint.
      security:
        - serviceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayVideoCancelTaskRequest"
      responses:
        "200":
          description: Provider video cancellation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayVideoCancelTaskEnvelope"
        "401":
          $ref: "#/components/responses/GatewayError"
        "422":
          $ref: "#/components/responses/GatewayError"
        "502":
          $ref: "#/components/responses/GatewayError"
  /internal/provider/text/stream:
    post:
      operationId: internalProviderTextStream
      summary: Internal Provider Gateway text stream
      description: Internal API. Requires bearer service token and streams provider.delta followed by exactly one provider.completed or provider.failed terminal event. Delta events include providerCallId, attempt, and a monotonic sequence; providerRequestId is populated by the logical request layer.
      security:
        - serviceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayTextRequest"
      responses:
        "200":
          description: Server-sent text stream with provider.delta and provider.completed/provider.failed terminal events
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/GatewayError"
        "422":
          $ref: "#/components/responses/GatewayError"
  /internal/provider/manifests/test-run:
    post:
      operationId: internalProviderManifestTestRun
      summary: Internal Provider Gateway manifest test run
      description: Internal API. Requires bearer service token and keeps direct provider execution inside Provider Gateway.
      security:
        - serviceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayManifestTestRunRequest"
      responses:
        "200":
          description: Declarative provider test result executed by Provider Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestTestRunResultEnvelope"
        "401":
          $ref: "#/components/responses/GatewayError"
        "422":
          $ref: "#/components/responses/GatewayError"
        "502":
          $ref: "#/components/responses/GatewayError"
