name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate
        run: pnpm run test

      - name: Community source archive and independent build audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/check-ce-release.ps1 -RequireClean -SkipImageBuild -EvidencePath tmp/ce-release-audit-ci.json

      - name: Upload Community audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: community-source-audit-${{ github.sha }}
          path: tmp/ce-release-audit-ci.json
          if-no-files-found: error

      - name: Install Playwright Chromium
        run: pnpm --filter @cineweave/web exec playwright install --with-deps chromium

      - name: Commerce browser E2E
        run: pnpm run test:commerce:e2e

      - name: Compose build
        run: docker compose -f compose.yml build api provider-gateway script-worker media-worker web
