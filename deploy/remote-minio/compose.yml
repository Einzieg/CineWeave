name: cineweave-minio

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    env_file:
      - ${MINIO_ENV_FILE:-.env}
    ports:
      - "${MINIO_API_HOST_PORT:-19290}:9000"
    volumes:
      - /srv/cineweave-minio/data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    env_file:
      - ${MINIO_ENV_FILE:-.env}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./cineweave-policy.json:/config/cineweave-policy.json:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        if mc admin user info local "$$S3_ACCESS_KEY_ID" >/dev/null 2>&1; then
          mc admin user enable local "$$S3_ACCESS_KEY_ID"
        else
          mc admin user add local "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        fi
        mc admin policy create local cineweave-rw /config/cineweave-policy.json
        mc admin policy attach local cineweave-rw --user "$$S3_ACCESS_KEY_ID"
