kind: ProviderConnector
version: v1
id: volcengine-ark
name: 火山方舟
transport: http
baseUrl: https://ark.cn-beijing.volces.com
auth:
  type: bearer
models:
  - id: doubao-seed-1.6
    displayName: Doubao Seed 1.6
    modality: text
    capabilities:
      taskTypes:
        - text.generate
        - text.stream
      executionMode: sync
  - id: doubao-seedream-4-0-250828
    displayName: Seedream 4.0
    modality: image
    capabilities:
      taskTypes:
        - image.generate
      executionMode: sync
  - id: doubao-seedance-2-0-260128
    displayName: Seedance 2.0
    modality: video
    capabilities:
      taskTypes:
        - video.text_to_video
        - video.image_to_video
        - video.create_task
        - video.poll_task
        - video.cancel_task
      executionMode: async
endpoints:
  image_generate:
    endpointType: sync
    method: POST
    pathTemplate: "{{ account.config.imageGenerationPath }}"
    headersTemplate:
      Content-Type: application/json
    requestTemplate:
      model: "{{ model.id }}"
      prompt: "{{ input.prompt }}"
      size: "{{ input.size }}"
      watermark: false
      response_format: "{{ input.responseFormat }}"
    responseMapping:
      imageUrl: $.data[0].url
      b64Json: $.data[0].b64_json
      errorMessage: $.error.message
    timeoutMs: 120000
  video_create:
    endpointType: async_create
    method: POST
    pathTemplate: "{{ account.config.videoCreateTaskPath }}"
    pollEndpointKey: video_poll
    headersTemplate:
      Content-Type: application/json
    requestTemplate:
      model: "{{ model.id }}"
      content:
        - type: text
          text: "{{ input.prompt }}"
      ratio: "{{ input.aspectRatio }}"
      resolution: "{{ input.resolution }}"
      duration: "{{ input.duration }}"
      watermark: false
      generate_audio: false
      camera_fixed: false
      return_last_frame: true
    responseMapping:
      externalTaskId: $.id
      status: $.status
      videoUrl: $.content.video_url
      errorMessage: $.error.message
      progress: $.progress
    timeoutMs: 120000
  video_poll:
    endpointType: async_poll
    method: GET
    pathTemplate: "{{ account.config.videoPollTaskPath }}/{{ task.externalTaskId }}"
    headersTemplate:
      Content-Type: application/json
    requestTemplate: {}
    responseMapping:
      externalTaskId: $.id
      status: $.status
      videoUrl: $.content.video_url
      errorMessage: $.error.message
      progress: $.progress
    timeoutMs: 120000
  video_cancel:
    endpointType: sync
    method: POST
    pathTemplate: "{{ account.config.videoCancelTaskPath }}/{{ task.externalTaskId }}/cancel"
    headersTemplate:
      Content-Type: application/json
    requestTemplate: {}
    responseMapping:
      externalTaskId: $.id
      status: $.status
      errorMessage: $.error.message
    timeoutMs: 60000
